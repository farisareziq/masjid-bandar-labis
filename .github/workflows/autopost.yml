# ============================================================
# Auto-post siaran video Facebook ke TikTok (via Buffer)
# Berjalan: setiap 15 minit + manual (workflow_dispatch)
# Secrets diperlukan:
#   FB_ACCESS_TOKEN     (sedia ada)
#   BUFFER_API_KEY      (Settings -> API di buffer.com)
#   BUFFER_CHANNEL_ID   (ID saluran TikTok; boleh auto-kesan)
#   BUFFER_MAX_DURATION_SEC (600 = 10 minit)
# ============================================================
name: Auto-post TikTok (Buffer)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: tiktok-autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autopost:
    # Elak gelung: jangan jalankan semula untuk komit auto sendiri
    if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'auto-deploy:')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sediakan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Semak secrets (langkau jika belum disediakan)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          if [ -z "$BUFFER_API_KEY" ]; then
            echo "Secrets Buffer belum disediakan - workflow dilangkau (tunggu setup)."
            exit 0
          fi

      - name: Auto-post ke TikTok (via Buffer)
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_MAX_DURATION_SEC: ${{ secrets.BUFFER_MAX_DURATION_SEC }}
        run: node scripts/tiktok/autopost.js

      - name: Commit state jika berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/tiktok/state.json
          if git diff --cached --quiet; then
            echo "Tiada perubahan - selesai."
          else
            git commit -m "auto-deploy: kemas kini state TikTok"
            git push
          fi
