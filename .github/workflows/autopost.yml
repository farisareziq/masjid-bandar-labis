# ============================================================
# Auto-post siaran video Facebook ke TikTok (via Buffer)
# Berjalan: setiap 15 minit + manual (workflow_dispatch)
# Secrets diperlukan:
#   FB_ACCESS_TOKEN     (sedia ada)
#   BUFFER_API_KEY      (Settings -> API di buffer.com)
#   BUFFER_CHANNEL_ID   (ID saluran TikTok; boleh auto-kesan)
#   BUFFER_MAX_DURATION_SEC (600 = 10 minit)
# ============================================================
name: Auto-post TikTok (Buffer)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_dummy:
        description: "Ujian dummy: cipta video ujian 11 minit, pangkas, hantar ke Buffer -> TikTok"
        type: boolean
        default: false

concurrency:
  group: tiktok-autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autopost:
    # Elak gelung: jangan jalankan semula untuk komit auto sendiri
    if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'auto-deploy:')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sediakan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang ffmpeg (untuk ujian dummy)
        if: ${{ github.event.inputs.test_dummy == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          echo "::notice::ffmpeg_path=$(command -v ffmpeg || echo MISSING)"

      - name: Semak secrets (langkau jika belum disediakan)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          if [ -z "$BUFFER_API_KEY" ]; then
            echo "Secrets Buffer belum disediakan - workflow dilangkau (tunggu setup)."
            exit 0
          fi

      - name: Auto-post ke TikTok (via Buffer)
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_MAX_DURATION_SEC: ${{ secrets.BUFFER_MAX_DURATION_SEC }}
          TEST_DUMMY: ${{ github.event.inputs.test_dummy }}
        run: |
          if [ "$TEST_DUMMY" = "true" ]; then
            node scripts/tiktok/autopost.js --test-dummy
          else
            node scripts/tiktok/autopost.js
          fi

      - name: Commit state jika berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/tiktok/state.json
          if git diff --cached --quiet; then
            echo "Tiada perubahan - selesai."
            exit 0
          fi
          for i in 1 2 3; do
            git commit -m "auto-deploy: kemas kini state TikTok"
            if git push; then
              exit 0
            fi
            echo "Push ditolak (konflik) - rebase dan cuba semula..."
            git pull --rebase origin main
          done
          echo "Gagal push selepas 3 cubaan."
          exit 1
